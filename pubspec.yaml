name: my_pdfs
description: Lecteur et bibliothèque PDF personnelle pour Android.
publish_to: 'none'
version: 0.6.0+7

environment:
  sdk: ^3.9.0

# Les paquets (pdfrx, sqflite, file_picker…) sont ajoutés par setup.sh
# avec `flutter pub add`, pour récupérer les dernières versions compatibles
# avec ton Flutter.
dependencies:
  crypto: ^3.0.8
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  http: ^1.6.0
  material_ui: ^1.10.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^2.12.0
  sqflite: ^2.4.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
