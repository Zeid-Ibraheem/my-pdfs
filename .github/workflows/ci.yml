# Vérifications automatiques à chaque push : GitHub lance les tests du
# serveur et l'analyse du code de l'appli. Résultat visible dans l'onglet
# « Actions » du dépôt (coche verte ou croix rouge à côté de chaque commit).
name: Vérifications

on:
  push:
  pull_request:

jobs:
  serveur:
    name: Tests du serveur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Outils système (couvertures)
        run: sudo apt-get install -y poppler-utils
      - name: Dépendances
        run: pip install -r server/requirements.txt
      - name: Tests
        working-directory: server
        run: python -m unittest discover -s tests -v

  appli:
    name: Analyse de l'appli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get
      - name: Analyse (seules les erreurs bloquent)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
